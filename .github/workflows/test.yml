name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # 테스트는 node-hid·Electron 없이 전부 돈다 (HANDOFF.md). 의존성 설치를 건너뛰어 빠르고 확실하게 한다.
      - run: npm test
